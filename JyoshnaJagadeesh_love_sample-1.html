<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JyoshnaJagadeesh ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:Arial,sans-serif;text-align:center;color:white;overflow:hidden;
background:radial-gradient(circle at top,#263238,#071b14 60%,#020806)}
.screen{width:min(94%,720px);padding:25px}
.heart{width:105px;height:105px;background:#ff1744;transform:rotate(-45deg);
margin:15px auto 65px;position:relative;box-shadow:0 0 25px #ff1744,0 0 70px #ff174488;
animation:pulse 1.1s infinite}
.heart:before,.heart:after{content:"";position:absolute;width:105px;height:105px;background:#ff1744;border-radius:50%}
.heart:before{top:-52px;left:0}.heart:after{top:0;left:52px}
@keyframes pulse{50%{transform:rotate(-45deg) scale(1.12)}}
.btn,.link{display:inline-block;padding:15px 27px;border-radius:30px;font-size:19px;font-weight:bold;text-decoration:none;cursor:pointer}
.btn{border:0;background:linear-gradient(135deg,#00e676,#00a152);color:white;box-shadow:0 8px 25px #00e67655}
.link{color:white;background:linear-gradient(135deg,#ff4081,#d500f9);box-shadow:0 7px 25px #ff408166}
h1{font-size:clamp(30px,7vw,55px);margin:12px 0}
h2{font-size:clamp(22px,5vw,35px);margin:18px 0 28px}
.hidden{display:none}.fade{animation:fade .9s ease}
@keyframes fade{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:none}}
.final h1{background:linear-gradient(90deg,#ff1744,#ffea00,#00e5ff,#ff4081,#76ff03);
background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rainbow 4s linear infinite}
@keyframes rainbow{to{background-position:300%}}
.heartline{font-size:40px;letter-spacing:8px}.small{color:#c8e6c9;font-size:15px;margin-top:18px}
.float{position:fixed;bottom:-40px;animation:up 5s linear forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-110vh) rotate(360deg);opacity:0}}
</style>
</head>
<body>
<div class="screen">
<section id="one" class="fade">
<div class="heart"></div>
<button class="btn" onclick="showTwo()">💚 Open My Heart 💚</button>
<div class="small">Tap chey potti ❤️</div>
</section>

<section id="two" class="hidden fade">
<div class="heartline">👀 ❤️ 👀</div>
<h1>Endey Chusthunnav Nee Potti 😜❤️</h1>
<h2>👇 Kinda unna link ni tap chey 👇</h2>
<a class="link" href="#" onclick="showThree();return false;">🔗 JyoshnaJagadeesh ❤️</a>
<div class="small">👆 Tap Chey 💖</div>
</section>

<section id="three" class="hidden final fade">
<div class="heartline">💗 💕 💗</div>
<h2>Anduke NUV antey antha istam naku 🥹❤️</h2>
<h1>Potti Moham Dhana 😘❤️</h1>
<h1>I Love You 💖</h1>
<p>Forever special to me 💕</p>
</section>
</div>
<script>
function showTwo(){
document.getElementById("one").classList.add("hidden");
document.getElementById("two").classList.remove("hidden");
}
function showThree(){
document.getElementById("two").classList.add("hidden");
document.getElementById("three").classList.remove("hidden");
setInterval(()=>{
const x=document.createElement("div");x.className="float";
x.textContent=["❤️","💕","💖","💗","💓","✨"][Math.floor(Math.random()*6)];
x.style.left=Math.random()*100+"vw";x.style.fontSize=(20+Math.random()*25)+"px";
x.style.animationDuration=(4+Math.random()*3)+"s";document.body.appendChild(x);
setTimeout(()=>x.remove(),7500);
},300);
}
</script>
</body>
</html>
